[project]
name = "hackers-campus-api"
version = "0.1.0"
description = "FastAPI backend for Hackers Campus"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14.0",
  "argon2-cffi>=23.1.0",
  "celery[redis]>=5.4.0",
  "fastapi>=0.115.5",
  "httpx>=0.28.1",
  "pydantic-settings>=2.7.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.3",
  "redis>=5.2.0",
  "uvicorn[standard]>=0.32.1"
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.2"
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]

